name: Release Anime Wallpaper

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (optional, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      should_release: ${{ steps.version_step.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version Tag
        id: version_step
        run: |
          # 1. If triggered by git tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Triggered by tag: $TAG"
            exit 0
          fi

          # 2. If triggered by workflow_dispatch with explicit version input
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Triggered manually with version: $TAG"
            exit 0
          fi

          # 3. Check for skip flags in latest commit
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qiE '\[(skip ci|skip release)\]'; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Skip release flag detected."
            exit 0
          fi

          # 4. Auto-versioning from push to main
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            CLEAN_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
          fi

          # Determine bump type based on conventional commit prefix
          if echo "$COMMIT_MSG" | grep -qiE '^(feat|feature)(\(.*\))?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "Previous tag: $LATEST_TAG"
          echo "Determined next auto version: $NEXT_TAG"

          # Tag origin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG [skip ci]"
          git push origin "$NEXT_TAG" || echo "Tag push skipped or already exists"

          echo "version=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

  run-tests:
    name: Run Tests & Security Validation
    needs: prepare-version
    if: needs.prepare-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET & Integration Tests
        run: dotnet test tests/AnimeWallpaper.Tests/AnimeWallpaper.Tests.csproj --verbosity normal

  build-windows:
    name: Build Windows (win-x64)
    needs: [prepare-version, run-tests]
    if: needs.prepare-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AnimeWallpaper.csproj

      - name: Publish Self-Contained Win-x64
        run: >
          dotnet publish AnimeWallpaper.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare-version.outputs.version }}"
          $zipName = "AnimeWallpaper-$tag-win-x64.zip"
          Copy-Item -Path "README.md", "LICENSE" -Destination "./publish" -ErrorAction SilentlyContinue
          Compress-Archive -Path "./publish/*" -DestinationPath "./$zipName" -Force
          mkdir artifacts
          Move-Item -Path "./$zipName" -Destination "./artifacts/"
          Copy-Item -Path "./publish/AnimeWallpaper.exe" -Destination "./artifacts/"

      - name: Build MSI Installer (WiX)
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare-version.outputs.version }}"
          $cleanVersion = $tag.TrimStart('v')
          if ($cleanVersion -notmatch '^\d+\.\d+\.\d+') { $cleanVersion = "1.0.0.0" }
          elseif ($cleanVersion -match '^\d+\.\d+\.\d+$') { $cleanVersion = "$cleanVersion.0" }

          $wixDir = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixDir) { $env:PATH = "$wixDir;$env:PATH" }

          $msiName = "AnimeWallpaper-$tag-win-x64.msi"
          candle -nologo -dPublishDir="$(Get-Location)\publish" -dSourceDir="$(Get-Location)" -dProductVersion="$cleanVersion" .\installer\AnimeWallpaper.wxs -out .\installer\AnimeWallpaper.wixobj
          light -nologo -ext WixUIExtension -sval .\installer\AnimeWallpaper.wixobj -out "./artifacts/$msiName"
          if (Test-Path "./artifacts/$msiName") {
            Copy-Item -Path "./artifacts/$msiName" -Destination "./artifacts/AnimeWallpaper-Installer.msi"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ./artifacts/*

  build-macos:
    name: Build macOS (arm64)
    needs: [prepare-version, run-tests]
    if: needs.prepare-version.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package macOS App
        run: |
          TAG="${{ needs.prepare-version.outputs.version }}"
          chmod +x ./scripts/build-macos.sh
          ./scripts/build-macos.sh "$TAG"

      - name: Prepare macOS Artifacts
        run: |
          mkdir -p artifacts
          cp dist/macos/*.zip artifacts/ || true
          cp dist/macos/*.dmg artifacts/ || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ./artifacts/*

  build-linux:
    name: Build Linux (linux-x64)
    needs: [prepare-version, run-tests]
    if: needs.prepare-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish Linux Binary
        run: |
          dotnet publish linux/AnimeWallpaper.Linux.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -o ./publish-linux
          chmod +x ./publish-linux/anime-wallpaper

      - name: Package Linux Tarball
        run: |
          TAG="${{ needs.prepare-version.outputs.version }}"
          TAR_NAME="AnimeWallpaper-$TAG-linux-x64.tar.gz"
          mkdir -p artifacts
          tar -czvf "artifacts/$TAR_NAME" -C ./publish-linux anime-wallpaper

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ./artifacts/*

  release:
    name: Create GitHub Release
    needs: [prepare-version, build-windows, build-macos, build-linux]
    if: needs.prepare-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Prepare Release Assets & Checksums
        run: |
          TAG="${{ needs.prepare-version.outputs.version }}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          
          mkdir -p ./dist-release
          find ./release-files -type f -exec cp {} ./dist-release/ \;
          
          cd ./dist-release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist-release/*
          tag_name: ${{ needs.prepare-version.outputs.version }}
          name: Anime Wallpaper ${{ needs.prepare-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
